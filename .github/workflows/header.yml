name: Header

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/render.py", ".github/workflows/header.yml"]

permissions:
  contents: write           # lets the job commit the refreshed header back to the repo

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render README graphics
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/render.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "Update header stats"
          git push
